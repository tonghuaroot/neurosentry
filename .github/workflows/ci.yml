name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.out

      - name: Build binary
        run: |
          make build
          ./bin/neurosentry --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev

      - name: Build binary
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: neurosentry-linux-amd64
          path: bin/neurosentry

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            -t neurosentry:${{ github.sha }} \
            -f deploy/docker/Dockerfile \
            --load .

      # Docker push is disabled until DOCKER_USERNAME and DOCKER_PASSWORD secrets are configured
