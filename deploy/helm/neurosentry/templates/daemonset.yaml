apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "neurosentry.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neurosentry.labels" . | nindent 4 }}
spec:
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "neurosentry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "neurosentry.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "neurosentry.name" . }}
      hostPID: true       # required for eBPF process attribution
      hostNetwork: true   # required for TC/XDP
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: neurosentry
          image: {{ include "neurosentry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/neurosentry/config.yaml
            {{- if .Values.allowDegraded }}
            - --allow-degraded
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: ["BPF", "NET_ADMIN", "SYS_ADMIN"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
            - name: web
              containerPort: {{ .Values.ports.web }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.web }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ports.web }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: config
              mountPath: /etc/neurosentry
              readOnly: true
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: sys-kernel-btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: config
          configMap:
            name: {{ include "neurosentry.name" . }}-config
