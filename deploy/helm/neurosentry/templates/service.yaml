apiVersion: v1
kind: Service
metadata:
  name: {{ include "neurosentry.name" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neurosentry.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "neurosentry.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
    - name: web
      port: {{ .Values.ports.web }}
      targetPort: web
  type: ClusterIP
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "neurosentry.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neurosentry.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "neurosentry.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
